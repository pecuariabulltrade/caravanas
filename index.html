<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión de Caravanas</title>
<style>
  :root{
    /* paleta campera: verde monte, pasto, ocre/trigo, cuero, teja, crema */
    --azul:#3f6b3a; --naranja:#bc4749; --verde:#6a994e; --amar:#c9932b; --rosa:#8c6a4a;
    --tinta:#2e2a24; --gris:#6e665b; --linea:#e4dccb; --fondo:#f4efe4; --tarjeta:#fffdf9; --suave:#f3eee2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--fondo);color:var(--tinta);font-size:15px}
  h1,h2,h3{margin:0 0 .4em}
  a{color:var(--azul)}
  button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:.55em 1em;
         background:var(--azul);color:#fff;font-weight:600}
  button.sec{background:#ece6d8;color:var(--tinta)}
  button.gris{background:#e3dccd;color:var(--tinta)}
  button:disabled{opacity:.5;cursor:default}
  input,select,textarea{font:inherit;padding:.5em .6em;border:1px solid var(--linea);
         border-radius:8px;background:#fff;width:100%}
  label{display:block;font-size:.82rem;color:var(--gris);margin:.2em 0 .25em;font-weight:600}
  .fila{display:flex;gap:.7rem;flex-wrap:wrap}
  .fila > *{flex:1;min-width:120px}
  .tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;
           padding:1.1rem 1.2rem;margin-bottom:1rem}
  .chip{display:inline-block;padding:.15em .6em;border-radius:20px;font-size:.78rem;font-weight:700}
  .ok{background:#e6efdc;color:#2f5a2a}
  .warn{background:#f6e3d3;color:#8a4a12}
  .mut{color:var(--gris);font-size:.86rem}
  table{border-collapse:collapse;width:100%;font-size:.9rem}
  th,td{text-align:left;padding:.45em .5em;border-bottom:1px solid var(--linea)}
  th{color:var(--gris);font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
  .num{font-variant-numeric:tabular-nums}
  /* --- layout --- */
  header.top{background:var(--tarjeta);border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:5}
  .top .in{max-width:1080px;margin:auto;display:flex;align-items:center;gap:1rem;padding:.7rem 1rem}
  .top .marca{font-weight:800;font-size:1.05rem}
  .top .marca small{color:var(--gris);font-weight:600}
  nav.menu{max-width:1080px;margin:auto;display:flex;gap:.2rem;padding:0 .6rem;flex-wrap:wrap}
  nav.menu a{padding:.6em .85em;color:var(--gris);font-weight:600;border-bottom:3px solid transparent;
             text-decoration:none;cursor:pointer;white-space:nowrap}
  nav.menu a.act{color:var(--azul);border-bottom-color:var(--azul)}
  main{max-width:1080px;margin:auto;padding:1.1rem 1rem 4rem}
  .oculto{display:none!important}
  /* --- panel --- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem}
  .kpi{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:1rem}
  .kpi .n{font-size:2rem;font-weight:800;line-height:1}
  .kpi .t{color:var(--gris);font-size:.85rem;margin-top:.3rem}
  .panelgrid{display:grid;grid-template-columns:1fr;gap:1rem}
  @media(min-width:760px){.panelgrid{grid-template-columns:1.1fr .9fr}}
  .leyenda{display:flex;flex-direction:column;gap:.35rem;justify-content:center}
  .leyenda .it{display:flex;align-items:center;gap:.5rem;font-size:.92rem}
  .leyenda .pt{width:13px;height:13px;border-radius:4px;flex:0 0 auto}
  .donutwrap{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
  /* --- login --- */
  #login{position:fixed;inset:0;background:linear-gradient(160deg,#e9e2d0,#f4efe4);
         display:flex;align-items:center;justify-content:center;z-index:50}
  #login .caja{background:var(--tarjeta);border:1px solid var(--linea);border-radius:18px;padding:2rem;
               width:min(380px,92vw);box-shadow:0 20px 50px rgba(20,40,80,.12)}
  .msg{padding:.6em .8em;border-radius:9px;margin:.6rem 0;font-size:.9rem;display:none}
  .msg.e{background:#fdecec;color:#b12626;display:block}
  .msg.k{background:#e4f6ee;color:#0c7a52;display:block}
  .aviso{background:#fbf3df;border:1px solid #e6d3a3;border-radius:10px;padding:.7em .9em;
         font-size:.86rem;color:#6a5312;margin:.5rem 0}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid #fff6;border-top-color:#fff;
        border-radius:50%;animation:g .7s linear infinite;vertical-align:-2px}
  @keyframes g{to{transform:rotate(360deg)}}
  /* --- dashboard observador --- */
  .dash h2{font-size:1.25rem}
  .dash .sec{margin:1.2rem 0 .5rem;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);font-weight:700}
  .dash .campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.9rem}
  .dash .campo{background:var(--tarjeta);border:1px solid var(--linea);border-radius:16px;padding:1rem 1.1rem}
  .dash .campo h3{font-size:1.15rem;margin:0}
  .dash .badge{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;padding:.15em .55em;border-radius:6px;background:#ebe4d3;color:var(--gris);vertical-align:middle;margin-left:.4rem}
  .dash .big{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin:.7rem 0}
  .dash .big div{background:var(--suave);border-radius:12px;padding:.7rem .8rem}
  .dash .big .n{font-size:1.9rem;font-weight:800;line-height:1.05}
  .dash .big .t{font-size:.78rem;color:var(--gris);margin-top:.25rem}
  .dash table{font-size:.88rem}
  .dash .tot{font-weight:800;background:var(--suave)}
  .dash .stockgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:.9rem}
  .dash .resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.7rem}
  .dash .resumen div{background:var(--tarjeta);border:1px solid var(--linea);border-radius:14px;padding:.9rem 1rem}
  .dash .resumen .n{font-size:1.7rem;font-weight:800;line-height:1.05}
  .dash .resumen .t{font-size:.78rem;color:var(--gris);margin-top:.25rem}
  .dash .pie{color:var(--gris);font-size:.8rem;margin-top:1.2rem}
  /* --- celular --- */
  @media(max-width:640px){
    body{font-size:14px}
    .top .in{flex-wrap:wrap;gap:.5rem;padding:.6rem .8rem}
    .top .marca{font-size:1rem;width:100%}
    #campoBox{margin-left:0!important;width:100%}
    #campoBox select{flex:1;min-width:0!important}
    #userLbl{font-size:.78rem;max-width:55vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    nav.menu{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:0 .3rem}
    nav.menu a{padding:.55em .6em;font-size:.9rem}
    main{padding:.8rem .7rem 3rem}
    .tarjeta{padding:.9rem .8rem;border-radius:12px}
    .kpis{grid-template-columns:repeat(2,1fr);gap:.6rem}
    .kpi{padding:.75rem}
    .kpi .n{font-size:1.55rem}
    .fila > *{min-width:100%}
    table{font-size:.82rem}
    th,td{padding:.4em .35em}
    .tablewrap{overflow-x:auto}
    .dash .big .n{font-size:1.6rem}
    .dash .campos,.dash .stockgrid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login">
  <div class="caja">
    <div class="marca" style="font-weight:800;font-size:1.2rem;margin-bottom:.2rem">Gestión de Caravanas</div>
    <div class="mut" style="margin-bottom:1rem">Entrá con tu usuario y contraseña.</div>
    <div id="loginMsg" class="msg"></div>
    <label>Correo (usuario)</label>
    <input id="email" type="email" autocomplete="username" placeholder="tu@correo.com">
    <label style="margin-top:.7rem">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button id="btnLogin" style="width:100%;margin-top:1.1rem">Entrar</button>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app" class="oculto">
  <header class="top">
    <div class="in">
      <div class="marca">Gestión de Caravanas <small id="rolLbl"></small></div>
      <div id="campoBox" style="display:flex;align-items:center;gap:.5rem;margin-left:1rem">
        <label for="campoSel" style="margin:0;font-weight:600">Campo:</label>
        <select id="campoSel" style="width:auto;min-width:14rem;padding:.35rem .5rem"></select>
        <small class="mut" id="campoProp"></small>
      </div>
      <div style="flex:1"></div>
      <span class="mut" id="userLbl"></span>
      <button class="gris" id="btnSalir">Salir</button>
    </div>
    <nav class="menu" id="menu"></nav>
  </header>
  <main id="vista"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
// ======================================================================
//  Conexión
// ======================================================================
const PALETA = ['#3f6b3a','#bc4749','#c9932b','#6a994e','#8c6a4a','#a7c957'];
let sb, USUARIO=null, ROL='consulta';
// Campo (establecimiento) activo: {id, nombre, propietario}
let CAMPO={id:1,nombre:'',propietario:''}, CAMPOS=[];

function iniciarCliente(){
  if(!window.CONFIG || CONFIG.SUPABASE_URL.includes('TU-PROYECTO')){
    document.getElementById('loginMsg').className='msg e';
    document.getElementById('loginMsg').textContent =
      'Falta configurar la conexión: completá config.js con la URL y la anon key de tu proyecto Supabase.';
    return false;
  }
  sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  return true;
}

// ---- helpers UI ----
const $ = s => document.querySelector(s);
const el = (t,p={},...h)=>{const e=document.createElement(t);Object.assign(e,p);
  for(const c of h){if(c==null)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const fmt = n => (n==null?'—':Number(n).toLocaleString('es-AR'));
function esc(s){return String(s==null?'':s)}

async function rpc(fn, args){ const {data,error}=await sb.rpc(fn,args||{}); if(error) throw error; return data; }
function errMsg(e){ return (e&&e.message)||String(e); }

// ======================================================================
//  Arranque / sesión
// ======================================================================
async function arrancar(){
  if(!iniciarCliente()) return;
  const {data:{session}} = await sb.auth.getSession();
  if(session){ await entrar(session.user); }
}
async function login(){
  const b=$('#btnLogin'); const m=$('#loginMsg'); m.className='msg';
  b.disabled=true; b.innerHTML='<span class="spin"></span>';
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});
    if(error) throw error;
    await entrar(data.user);
  }catch(e){ m.className='msg e'; m.textContent='No se pudo entrar: '+errMsg(e); }
  b.disabled=false; b.textContent='Entrar';
}
async function entrar(user){
  USUARIO=user;
  let perfil=null;
  try{ const {data}=await sb.from('perfiles').select('rol,nombre').eq('id',user.id).single(); perfil=data; }catch(e){}
  ROL = (perfil&&perfil.rol)||'consulta';
  $('#userLbl').textContent = (perfil&&perfil.nombre)||user.email;
  $('#rolLbl').textContent = ROL==='admin'?'· administrador':'· observador';
  $('#login').classList.add('oculto');
  $('#app').classList.remove('oculto');
  await cargarCampos();
  if(ROL!=='admin') $('#campoBox').style.display='none';   // el observador ve todos los campos juntos
  construirMenu();
  irA(ROL==='admin'?'panel':'dashboard');
}

// ---- Campos (establecimientos) ----
async function cargarCampos(){
  const sel=$('#campoSel');
  try{
    const r=await rpc('listar_campos');
    CAMPOS=r.campos||[];
    sel.innerHTML='';
    CAMPOS.forEach(c=>sel.append(el('option',{value:String(c.id)},c.nombre)));
    const act=CAMPOS.find(c=>c.id===r.actual)||CAMPOS[0];
    if(act){ CAMPO=act; sel.value=String(act.id); }
    pintarCampo();
    sel.onchange=async()=>{
      const id=Number(sel.value);
      try{
        const c=await rpc('set_campo',{p_campo_id:id});
        CAMPO={id:c.id,nombre:c.nombre,propietario:c.propietario};
        pintarCampo();
        irA(RUTA);   // re-dibuja la vista actual con el campo nuevo
      }catch(e){ alert('No pude cambiar de campo: '+errMsg(e)); sel.value=String(CAMPO.id); }
    };
  }catch(e){
    // Si la base todavía no tiene multi-campo, escondemos el selector y seguimos.
    $('#campoBox').style.display='none';
  }
}
function pintarCampo(){
  $('#campoProp').textContent = CAMPO.propietario ? '· '+CAMPO.propietario : '';
  document.title = 'Caravanas · '+(CAMPO.nombre||'');
}
async function salir(){ await sb.auth.signOut(); location.reload(); }

// ======================================================================
//  Menú y ruteo
// ======================================================================
const VISTAS = {
  dashboard:{t:'Dashboard',  admin:false, obs:true, f:vDashboard},
  panel:    {t:'Panel',      admin:false, f:vPanel},
  consultar:{t:'Consultar',  admin:false, f:vConsultar},
  guia:     {t:'Cierre de guía', admin:true, f:vGuia},
  virgenes: {t:'Vírgenes',   admin:true, f:vVirgenes},
  lotes:    {t:'Lotes',      admin:true, f:vLotes},
  bajas:    {t:'Bajas',      admin:true, f:vBajas},
  stock:    {t:'Stock SENASA', admin:false, f:vStock},
  usuarios: {t:'Configuración', admin:true, f:vUsuarios},
};
let RUTA='panel';
function construirMenu(){
  const m=$('#menu'); m.innerHTML='';
  for(const [k,v] of Object.entries(VISTAS)){
    if(ROL!=='admin' && !v.obs) continue;      // observador: sólo el Dashboard
    if(v.admin && ROL!=='admin') continue;
    m.append(el('a',{onclick:()=>irA(k),id:'nav-'+k},v.t));
  }
}
function irA(k){
  RUTA=k;
  document.querySelectorAll('nav.menu a').forEach(a=>a.classList.remove('act'));
  const n=$('#nav-'+k); if(n)n.classList.add('act');
  $('#vista').innerHTML=''; $('#vista').className='';
  VISTAS[k].f($('#vista'));
}

// ======================================================================
//  Donut SVG (sin librerías)
// ======================================================================
function donut(datos, tam=170, etiqueta='activas'){
  const total = datos.reduce((a,d)=>a+d.n,0)||1;
  const r=tam/2, ir=r*0.60, cx=r, cy=r; let ang=-Math.PI/2;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox',`0 0 ${tam} ${tam}`); svg.setAttribute('width',tam); svg.setAttribute('height',tam);
  datos.forEach((d,i)=>{
    const frac=d.n/total; const a2=ang+frac*Math.PI*2;
    const large = (a2-ang)>Math.PI?1:0;
    const x1=cx+r*Math.cos(ang), y1=cy+r*Math.sin(ang);
    const x2=cx+r*Math.cos(a2),  y2=cy+r*Math.sin(a2);
    const xi2=cx+ir*Math.cos(a2), yi2=cy+ir*Math.sin(a2);
    const xi1=cx+ir*Math.cos(ang),yi1=cy+ir*Math.sin(ang);
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} L${xi2} ${yi2} A${ir} ${ir} 0 ${large} 0 ${xi1} ${yi1} Z`);
    p.setAttribute('fill',PALETA[i%PALETA.length]);
    svg.append(p); ang=a2;
  });
  const t=document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('x',cx);t.setAttribute('y',cy-2);t.setAttribute('text-anchor','middle');
  t.setAttribute('font-size','20');t.setAttribute('font-weight','800');t.setAttribute('fill','#1d2430');
  t.textContent=fmt(total);
  const t2=document.createElementNS('http://www.w3.org/2000/svg','text');
  t2.setAttribute('x',cx);t2.setAttribute('y',cy+16);t2.setAttribute('text-anchor','middle');
  t2.setAttribute('font-size','11');t2.setAttribute('fill','#6e665b');t2.textContent=etiqueta;
  svg.append(t,t2);
  return svg;
}

// ======================================================================
//  VISTA · PANEL
// ======================================================================
async function vPanel(cont){
  cont.append(el('h2',{},'Panel'));
  const cargando=el('div',{className:'mut'},'Cargando…'); cont.append(cargando);
  let p, todos=[];
  try{ p=await rpc('panel'); }catch(e){ cargando.textContent='Error: '+errMsg(e); return; }
  try{ const t=await rpc('panel_todos'); todos=(t&&t.campos)||[]; }catch(e){}
  cargando.remove();
  const mio = todos.find(c=>c.id===CAMPO.id) || {};
  const comp=(p.composicion||[]).filter(x=>x.n>0);
  const activas = comp.reduce((a,x)=>a+x.n,0);

  // encabezado del campo actual
  const cab=el('div',{style:'display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin:.2rem 0 .7rem'});
  cab.append(el('h3',{style:'margin:0;font-size:1.2rem'},CAMPO.nombre||''));
  if(mio.condicion) cab.append(el('span',{className:'chip',style:'background:#ebe4d3;color:var(--gris)'},mio.condicion));
  if(CAMPO.propietario) cab.append(el('span',{className:'mut'},CAMPO.propietario));
  cont.append(cab);

  const tarjeta=(n,t,color,onClick,hint)=>{
    const k=el('div',{className:'kpi'});
    k.append(el('div',{className:'n',style:`color:${color||'var(--tinta)'}`},fmt(n)),el('div',{className:'t'},t));
    if(onClick){ k.style.cursor='pointer';
      k.append(el('div',{className:'mut',style:'font-size:.72rem;margin-top:.3rem'},hint||'tocá para ver ▾'));
      k.onclick=onClick; }
    return k;
  };
  const det=el('div',{style:'margin:.3rem 0 1rem'});
  let abierto=null;
  const toggle=(clave, render)=>{ if(abierto===clave){ det.innerHTML=''; abierto=null; return; } abierto=clave; render(); };

  // --- detalle: torta por categoría (activas / 90 días / 40 días) ---
  function pintarTorta(titulo, datos, etiqueta){
    det.innerHTML='';
    const box=el('div',{className:'tarjeta'});
    box.append(el('h3',{},titulo));
    const items=(datos||[]).filter(x=>x.n>0);
    if(!items.length){ box.append(el('div',{className:'mut'},'Sin caravanas en este grupo.')); det.append(box); return; }
    const wrap=el('div',{className:'donutwrap'});
    wrap.append(donut(items,170,etiqueta||'activas'));
    const leg=el('div',{className:'leyenda'});
    const tot=items.reduce((a,x)=>a+x.n,0)||1;
    const sub=el('div',{style:'margin-top:.6rem'});
    items.forEach((x,i)=>{
      const it=el('div',{className:'it',style:'cursor:pointer'});
      it.append(el('span',{className:'pt',style:`background:${PALETA[i%PALETA.length]}`}),
                el('span',{},`${x.nombre}: `), el('strong',{},fmt(x.n)),
                el('span',{className:'mut'},` (${Math.round(x.n/tot*100)}%) · ver fechas ▸`));
      it.onclick=()=>cargarDet(sub,'edad',x.nombre,'');
      leg.append(it);
    });
    wrap.append(leg); box.append(wrap, sub); det.append(box);
  }
  function verComposicion(){ pintarTorta('Composición del rodeo activo — por categoría', comp); }
  async function verTortaPlazo(tipo, titulo, etiqueta){
    det.innerHTML=''; det.append(el('div',{className:'mut'},'Cargando…'));
    try{ const d=await rpc('panel_detalle',{p_tipo:tipo,p_categoria:''});
      pintarTorta(titulo, (d.items||[]).map(x=>({nombre:x.categoria,n:x.n})), etiqueta);
    }catch(e){ det.innerHTML=''; det.append(el('div',{className:'aviso'},'Error: '+errMsg(e))); }
  }
  // --- detalle genérico (90 días / vírgenes / edad) ---
  async function cargarDet(c, tipo, cat, titulo){
    c.innerHTML=''; const load=el('div',{className:'mut'},'Cargando…'); c.append(load);
    let d; try{ d=await rpc('panel_detalle',{p_tipo:tipo,p_categoria:cat||''}); }
    catch(e){ c.innerHTML=''; c.append(el('div',{className:'aviso'},'Error: '+errMsg(e))); return; }
    c.innerHTML='';
    const box=el('div',{className:'tarjeta'});
    if(d.tipo==='cat'){
      box.append(el('h3',{},titulo), el('div',{className:'mut',style:'margin-bottom:.4rem'},'Tocá una categoría para ver la primera y la última activación.'));
      const tb=el('table'); tb.append(el('thead',{},filaTH(['Categoría','Cantidad'])));
      const tbody=el('tbody'); const sub=el('div',{style:'margin-top:.5rem'});
      (d.items||[]).forEach(x=>{ const tr=el('tr',{style:'cursor:pointer'},td(x.categoria),el('td',{className:'num'},fmt(x.n)));
        tr.onclick=()=>cargarDet(sub,'edad',x.categoria,''); tbody.append(tr); });
      tb.append(tbody); box.append(tb, sub);
    }else if(d.tipo==='rangos'){
      box.append(el('h3',{},'Vírgenes por tanda de numeración'));
      const tb=el('table'); tb.append(el('thead',{},filaTH(['Desde','Hasta','Cantidad'])));
      const tbody=el('tbody'); (d.items||[]).forEach(x=>tbody.append(el('tr',{},td(x.desde,'num'),td(x.hasta,'num'),el('td',{className:'num'},fmt(x.cantidad)))));

function vConsultar(cont){
  cont.append(el('h2',{},'Consultar'));
  cont.append(el('div',{className:'mut',style:'margin-bottom:.8rem'},
    'Buscá una caravana o subí un Excel/CSV. Te muestro estado, categoría, fecha de activación y las fechas de 40 y 90 días.'));

  const t=el('div',{className:'tarjeta'});
  const fila=el('div',{className:'fila'});
  const inp=el('input',{placeholder:'Pegá uno o varios números (o rango 123-130)'});
  const btn=el('button',{},'Consultar');
  fila.append(el('div',{style:'flex:3'},inp), el('div',{style:'flex:0 0 auto'},btn));
  t.append(fila);
  const filaX=el('div',{className:'fila',style:'margin-top:.7rem;align-items:center'});
  const file=el('input',{type:'file',accept:'.xlsx,.xls,.csv'});
  filaX.append(el('div',{},el('label',{},'…o subí un archivo con la columna de caravanas'),file));
  t.append(filaX);
  cont.append(t);

  const res=el('div'); cont.append(res);
  btn.onclick=()=>consultarNums(desglosar(inp.value),res);
  file.onchange=async()=>{ const nums=await numerosDeArchivo(file.files[0]); consultarNums(nums,res); };
}
function desglosar(txt){ return String(txt||'').split(/[\s,;]+/).filter(Boolean); }
async function numerosDeArchivo(f){
  if(!f) return [];
  const buf=await f.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  // busca la columna que más parezca caravanas (más celdas de 8+ dígitos)
  let mejor=0,mejorN=-1;
  const nc=Math.max(...rows.map(r=>r.length),0);
  for(let c=0;c<nc;c++){let s=0;for(const r of rows){const v=String(r[c]||'').replace(/\D/g,'');if(v.length>=8)s++;}if(s>mejorN){mejorN=s;mejor=c;}}
  const out=[]; for(const r of rows){const v=String(r[mejor]||'').trim();if(v && /\d/.test(v))out.push(v);}
  return out;
}
async function consultarNums(nums,res){
  res.innerHTML='';
  nums=nums.filter(Boolean);
  if(!nums.length){res.append(el('div',{className:'aviso'},'No encontré números para consultar.'));return;}
  const cargando=el('div',{className:'mut'},'Consultando…'); res.append(cargando);
  let d;
  try{ d=await rpc('consultar',{p_numeros:nums}); }catch(e){cargando.textContent='Error: '+errMsg(e);return;}
  cargando.remove();
  const box=el('div',{className:'tarjeta'});
  box.append(el('div',{className:'mut',style:'margin-bottom:.5rem'},
    `${d.total} encontrada(s)`+(d.no_estan&&d.no_estan.length?` · ${d.no_estan.length} sin registrar`:'')));
  if(d.items&&d.items.length){
    const tb=el('table');
    tb.append(el('thead',{},filaTH(['Caravana','Categoría','Estado','SENASA','Ingreso','40 días','90 días'])));
    const tbody=el('tbody');
    for(const it of d.items){
      const tr=el('tr');
      tr.append(td(it.caravana,'num'),td(it.categoria),
        tdChip(it.activa?'activa':it.estado, it.activa?'ok':'warn'),
        td(it.estado_senasa||'—'),
        td(it.fecha_activacion||'—','num'),td(it.fecha_40||'—','num'),td(it.fecha_90||'—','num'));
      tbody.append(tr);
    }
    tb.append(tbody); box.append(tb);
  }
  if(d.no_estan&&d.no_estan.length){
    box.append(el('div',{className:'aviso'},'No están en el sistema: '+d.no_estan.slice(0,40).join(', ')+(d.no_estan.length>40?'…':'')));
  }
  res.append(box);
}
function filaTH(arr){const tr=el('tr');arr.forEach(x=>tr.append(el('th',{},x)));return tr;}
function td(v,cls){return el('td',{className:cls||''},esc(v));}
function tdChip(txt,cls){const t=el('td');t.append(el('span',{className:'chip '+cls},txt));return t;}

    zona.innerHTML='';

      const cols = tits.length?tits:(ROL==='admin'?TITS:[]);

      const val=(t,cat)=>{ const it=its.find(i=>i.titular===t&&i.categoria===cat); return it?it.cantidad:0; };

function previstaBox(p){
  const box=el('div',{className:'tarjeta'});
  box.append(el('h3',{},'Prevista — así van a quedar'));
  box.append(el('div',{className:'mut',style:'margin-bottom:.5rem'},
    `Pedidas ${p.total_pedido} · tomaría ${p.total_tomaria}`+(p.faltan>0?` · faltan ${p.faltan} vírgenes`:'')+` · vírgenes disponibles ${p.disponibles}`));
  box.append(tablaGrupos(p.resumen,'tomaria'));
  const filas=(p.filas||[]);
  if(filas.length){
    const tb=el('table',{style:'margin-top:.7rem'});
    tb.append(el('thead',{},filaTH(['Caravana','Categoría','Lote','Ingreso','40 días','90 días'])));
    const tbody=el('tbody'); tb.append(tbody); box.append(tb);
    let mostradas=0;
    const pintar=(n)=>{ filas.slice(mostradas,mostradas+n).forEach(f=>tbody.append(
        el('tr',{},td(f.numero,'num'),td(f.categoria),td(f.lote),td(f.fecha_ingreso,'num'),td(f.fecha_40,'num'),td(f.fecha_90,'num'))));
      mostradas=Math.min(mostradas+n,filas.length); };
    pintar(12);
    const pie=el('div',{style:'margin-top:.4rem'}); box.append(pie);
    const actualizar=()=>{ pie.innerHTML='';
      if(mostradas<filas.length){
        const link=el('a',{style:'cursor:pointer;font-weight:600'},`▼ Ver las ${filas.length-mostradas} restantes`);
        link.onclick=()=>{ pintar(filas.length); actualizar(); };
        pie.append(link);
      } else if(filas.length>12){ pie.append(el('span',{className:'mut'},`Mostrando las ${filas.length}`)); }
      if(p.truncado) pie.append(el('div',{className:'mut'},'(prevista limitada a 500 filas)'));
    };
    actualizar();
  }
  return box;
}

    const ya=await loteExiste(rot);

                     : `¿Rotular estas caravanas como caja «${rot}»?`;
    if(!confirm(msg))return;
    bRot.disabled=true;bRot.innerHTML='<span class="spin"></span>';

      const r=await rpc('asignar_lote',args());
      res.innerHTML='';
      res.append(el('div',{className:'tarjeta'},el('h3',{},'Rotuladas ✔'),
        el('div',{},`${r.asignadas} caravanas → caja ${r.rotulo}`),
        r.mixta?el('div',{className:'aviso'},'⚠ Esta caja quedó con más de una categoría. Recordá: una caja = una sola categoría.'):null,
        (r.no_existen&&r.no_existen.length)?el('div',{className:'aviso'},'No existían: '+r.no_existen.join(', ')):null));
      await pintarResumen(res);
    }catch(e){res.innerHTML='';res.append(el('div',{className:'aviso'},'Error: '+errMsg(e)));}

  };
  pintarResumen(res);

// Cuántas caravanas hay ya en una caja con ese rótulo (0 = no existe).
async function loteExiste(rotulo){
  try{
    const {count}=await sb.from('v_caravanas').select('id',{count:'exact',head:true}).eq('lote',rotulo);
    return count||0;
  }catch(e){ return 0; }
}

async function abrirCaja(rotulo,tr){
  const next=tr.nextSibling;
  if(next && next.__detalle){ next.remove(); return; }
  let d; try{ d=await rpc('lote_detalle',{p_rotulo:rotulo}); }catch(e){ return; }
  const esAdmin = ROL==='admin';
  const trd=el('tr'); trd.__detalle=true;
  const tdd=el('td'); tdd.colSpan=6;
  const inner=el('div',{className:'tarjeta',style:'margin:.3rem 0;background:#f8fafc'});
  // fecha en que TODA la caja cumple 90 días = la más tardía de las 90 días
  const f90=(d||[]).map(f=>f.fecha_90).filter(Boolean).sort();
  const cumple90 = f90.length ? f90[f90.length-1] : null;
  inner.append(el('h3',{},'Caja '+rotulo+' — '+(d?d.length:0)+' caravanas'
    + (cumple90 ? '  ·  cumple 90 días: '+cumple90 : '')));

  // Barra de edición (sólo admin, sólo cajas reales)
  const editable = esAdmin && rotulo!=='(sin lote)';
  let bSacar, bBorrar;
  if(editable){
    inner.append(el('div',{className:'mut',style:'margin-bottom:.4rem'},
      'Tildá las caravanas que querés sacar de la caja, o eliminá el rótulo entero. Las que saques vuelven a CLASIFICAR (siguen activas).'));
    const barra=el('div',{className:'fila',style:'margin-bottom:.5rem'});
    bSacar=el('button',{className:'sec'},'Sacar seleccionadas de la caja');
    bBorrar=el('button',{className:'gris'},'Eliminar rótulo de la caja');
    barra.append(el('div',{style:'flex:0 0 auto'},bSacar),el('div',{style:'flex:0 0 auto'},bBorrar),el('div'));
    inner.append(barra);
  }

  const tb=el('table');
  const cols=(editable?['✓']:[]).concat(['Caravana','Categoría','Estado','Activación','40 días','90 días']);
  tb.append(el('thead',{},filaTH(cols)));
  const tbody=el('tbody');
  (d||[]).slice(0,300).forEach(f=>{
    const celdas=[td(f.numero,'num'),td(f.categoria),
      tdChip(f.activa?'activa':f.estado,f.activa?'ok':'warn'),td(f.fecha_activacion||'—','num'),
      td(f.fecha_40||'—','num'),td(f.fecha_90||'—','num')];
    if(editable){
      const cb=el('input',{type:'checkbox',value:f.id,className:'cbCaja'});
      const tdc=el('td'); tdc.append(cb);
      celdas.unshift(tdc);
    }
    tbody.append(el('tr',{},...celdas));
  });
  tb.append(tbody); inner.append(tb);
  if((d||[]).length>300) inner.append(el('div',{className:'mut',style:'margin-top:.3rem'},'… y '+(d.length-300)+' más'));

  if(editable){
    bSacar.onclick=async()=>{
      const ids=[...inner.querySelectorAll('input.cbCaja:checked')].map(c=>Number(c.value));
      if(!ids.length){ alert('Tildá al menos una caravana para sacar.'); return; }
      if(!confirm(`¿Sacar ${ids.length} caravana(s) de la caja «${rotulo}»? Vuelven a CLASIFICAR (siguen activas).`)) return;
      bSacar.disabled=true; bSacar.innerHTML='<span class="spin"></span>';
      try{ const r=await rpc('quitar_de_lote',{p_ids:ids});
        alert(`Se sacaron ${r.sacadas} caravana(s) de la caja.`); irA('lotes');
      }catch(e){ alert('Error: '+errMsg(e)); bSacar.disabled=false; bSacar.textContent='Sacar seleccionadas de la caja'; }
    };
    bBorrar.onclick=async()=>{
      if(!confirm(`¿Eliminar el rótulo de la caja «${rotulo}»? Sus ${d?d.length:0} caravanas vuelven a CLASIFICAR (siguen activas) y la caja desaparece.`)) return;
      bBorrar.disabled=true; bBorrar.innerHTML='<span class="spin"></span>';
      try{ const r=await rpc('quitar_de_lote',{p_rotulo:rotulo});
        alert(`Caja «${rotulo}» eliminada. ${r.sacadas} caravana(s) volvieron a CLASIFICAR.`); irA('lotes');
      }catch(e){ alert('Error: '+errMsg(e)); bBorrar.disabled=false; bBorrar.textContent='Eliminar rótulo de la caja'; }
    };
  }

  tdd.append(inner); trd.append(tdd);
  tr.parentNode.insertBefore(trd,tr.nextSibling);
}

// Editar la fecha de un cierre de guía (abre un mini-formulario debajo de la fila).
function editarFechaGuia(tr, g){
  const sig=tr.nextSibling;
  if(sig && sig.__editfecha){ sig.remove(); return; }              // toggle
  if(sig && sig.__detalle){ sig.remove(); }                        // cerrá el detalle si estaba abierto
  const trd=el('tr'); trd.__editfecha=true;
  const tdd=el('td'); tdd.colSpan=7;
  const caja=el('div',{className:'tarjeta',style:'margin:.3rem 0;background:#fefce8;border-color:#fde047'});
  caja.append(el('h3',{},'Corregir fecha del cierre '+(g.numero||'')));
  caja.append(el('div',{className:'mut',style:'margin-bottom:.4rem'},
    'Cambia la fecha de la guía y la fecha de activación de sus '+g.cantidad+' caravanas (recalcula 40 y 90 días).'));
  const cf=campoFecha(g.fecha);
  caja.append(el('label',{},'Nueva fecha'),cf.el);
  const acc=el('div',{className:'fila',style:'margin-top:.6rem'});
  const bG=el('button',{},'Guardar fecha'); const bC=el('button',{className:'gris'},'Cancelar');
  acc.append(el('div',{style:'flex:0 0 auto'},bG),el('div',{style:'flex:0 0 auto'},bC),el('div'));
  caja.append(acc);
  bC.onclick=()=>trd.remove();
  bG.onclick=async()=>{
    const iso=cf.getISO();
    if(!iso){ alert('Escribí la fecha como DÍA/MES/AÑO, ej: 03/09/2026.'); return; }
    if(!confirm('¿Corregir la fecha del cierre a '+cf.input.value+'? Se van a actualizar las '+g.cantidad+' caravanas.')) return;
    bG.disabled=true; bG.innerHTML='<span class="spin"></span>';
    try{ const r=await rpc('editar_fecha_guia',{p_guia_id:g.id,p_fecha:iso});
      alert('Fecha corregida a '+r.fecha+'. Se actualizaron '+r.actualizadas+' caravanas.');
      irA('guia');
    }catch(e){ alert('Error: '+errMsg(e)); bG.disabled=false; bG.textContent='Guardar fecha'; }
  };
  tdd.append(caja); trd.append(tdd);
  tr.parentNode.insertBefore(trd, tr.nextSibling);
}

// Despliega debajo de una fila la grilla de caravanas de esa guía o salida.
async function detalleCaravanasEnFila(tr, columna, valor, colspan){
  const next=tr.nextSibling;
  if(next && next.__detalle){ next.remove(); return; }
  let data;
  try{
    const r=await sb.from('v_caravanas')
      .select('numero,categoria,lote,fecha_ingreso,fecha_40,fecha_90,estado')
      .eq(columna,valor).order('numero');
    data=r.data||[];
  }catch(e){ return; }
  const trd=el('tr'); trd.__detalle=true;
  const tdd=el('td'); tdd.colSpan=colspan||7;
  const inner=el('div',{className:'tarjeta',style:'margin:.3rem 0;background:#f8fafc'});
  inner.append(el('h3',{},(columna==='guia_id'?'Ingresaron ':'Salieron ')+data.length+' caravanas'));
  if(data.length){
    const tb=el('table');
    tb.append(el('thead',{},filaTH(['Caravana','Categoría','Lote','Activación','40 días','90 días'])));
    const tbody=el('tbody');
    data.slice(0,500).forEach(f=>tbody.append(el('tr',{},td(f.numero,'num'),td(f.categoria||'—'),td(f.lote||'—'),
      td(f.fecha_ingreso||'—','num'),td(f.fecha_40||'—','num'),td(f.fecha_90||'—','num'))));
    tb.append(tbody); inner.append(tb);
    if(data.length>500) inner.append(el('div',{className:'mut',style:'margin-top:.3rem'},'… y '+(data.length-500)+' más'));
  }else{
    inner.append(el('div',{className:'mut'},'Sin caravanas asociadas.'));
  }
  tdd.append(inner); trd.append(tdd);
  tr.parentNode.insertBefore(trd,tr.nextSibling);
}

                 el('div',{style:'flex:0 0 auto'},bExtraer),el('div'));
      box.append(acc);
      const tb=el('table');
      tb.append(el('thead',{},filaTH(['✓','Caravana','Categoría','Lote','Activación','40 días','90 días'])));
      const tbody=el('tbody');
      (p.items||[]).forEach(f=>{
        const cb=el('input',{type:'checkbox',value:f.numero}); cb.checked=true;
        const tdc=el('td'); tdc.append(cb);
        tbody.append(el('tr',{},tdc,td(f.numero,'num'),td(f.categoria||'—'),td(f.lote||'—'),
          td(f.fecha_activacion||'—','num'),td(f.fecha_40||'—','num'),td(f.fecha_90||'—','num')));
      });
      tb.append(tbody); box.append(tb);
      bTodos.onclick=()=>box.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=true);
      bNada.onclick=()=>box.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
      bExtraer.onclick=async()=>{
        const nums=[...box.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value);
        if(!nums.length){alert('Tildá al menos una caravana.');return;}
        if(!confirm('¿Extraer '+nums.length+' caravanas a la salida?'))return;
        bExtraer.disabled=true; bExtraer.innerHTML='<span class="spin"></span>';
        try{
          const r=await rpc('sumar_a_salida',{p_salida_id:SALIDA.id,p_numeros:nums});
          res.innerHTML='';
          res.append(el('div',{className:'tarjeta'},
            el('div',{},`Extraídas a la salida: ${r.tomadas}`+(r.ya_en_esta?` · ya estaban ${r.ya_en_esta}`:''))));
          await estadoSalida(res);
          bPrevS.onclick();   // refrescar la prevista (ya no aparecen las extraídas)
        }catch(e){alert(errMsg(e));}
      };
      exRes.append(box);
    }catch(e){exRes.append(el('div',{className:'aviso'},'Error: '+errMsg(e)));}
    bPrevS.disabled=false; bPrevS.textContent='Ver prevista';
  };
  bConf.onclick=async()=>{
    if(!confirm('¿Confirmar la baja? Las caravanas de la salida quedan dadas de baja.'))return;
    try{ const r=await rpc('confirmar_salida',{p_salida_id:SALIDA.id});
      res.innerHTML='';res.append(el('div',{className:'tarjeta'},el('h3',{},'Baja confirmada ✔'),el('div',{},`${r.confirmadas} caravanas dadas de baja.`)));
      SALIDA=null;
      if(refHistSalidas) refHistSalidas();
    }catch(e){res.innerHTML='';res.append(el('div',{className:'aviso'},'Error: '+errMsg(e)));}
  };
}
async function estadoSalida(res){
  if(!SALIDA) return;
  try{
    const {data}=await sb.from('v_caravanas')
      .select('numero,categoria,lote,fecha_ingreso,fecha_40,fecha_90,estado')
      .eq('salida_id',SALIDA.id).order('numero');
    const filas=data||[];
    const box=el('div',{className:'tarjeta'});
    box.append(el('h3',{},`Caravanas en el pre-despacho: ${filas.length} de ${SALIDA.objetivo}`));
    if(filas.length){
      const tb=el('table');
      tb.append(el('thead',{},filaTH(['Caravana','Categoría','Lote','Activación','40 días','90 días'])));
      const tbody=el('tbody');
      filas.forEach(f=>tbody.append(el('tr',{},td(f.numero,'num'),td(f.categoria||'—'),td(f.lote||'—'),
        td(f.fecha_ingreso||'—','num'),td(f.fecha_40||'—','num'),td(f.fecha_90||'—','num'))));
      tb.append(tbody); box.append(tb);
    }else{
      box.append(el('div',{className:'mut'},'Todavía no cargaste ninguna caravana a esta salida.'));
    }
    res.append(box);
  }catch(e){ res.append(el('div',{className:'aviso'},'No pude leer las caravanas de la salida: '+errMsg(e))); }
}

// ---- utilidades ----
function hoyISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// Suma N días a una fecha 'YYYY-MM-DD' y devuelve 'YYYY-MM-DD'.
function sumarDias(iso,n){ if(!iso) return ''; const p=String(iso).slice(0,10).split('-'); const d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
// Campo de fecha en formato DÍA/MES/AÑO (como se acostumbra en Argentina).
// Devuelve un objeto {el, input, getISO}. getISO() da 'YYYY-MM-DD' o '' si está mal/vacío.
const _MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function campoFecha(valorISO, opts){
  opts=opts||{};
  const inp=el('input',{placeholder:'DD/MM/AAAA (día/mes/año)',maxLength:10,inputmode:'numeric'});
  if(valorISO===undefined && !opts.vacio) valorISO=hoyISO();
  if(valorISO){ const p=String(valorISO).slice(0,10).split('-'); inp.value=p[2]+'/'+p[1]+'/'+p[0]; }
  const prev=el('div',{className:'mut',style:'margin-top:.2rem;font-size:.85em'});
  function getISO(){
    const m=(inp.value||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if(!m) return '';
    let d=+m[1], mo=+m[2], y=+m[3]; if(y<100) y+=2000;
    if(mo<1||mo>12||d<1||d>31) return '';
    const dt=new Date(Date.UTC(y,mo-1,d));
    if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return '';
    return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }
  function upd(){ const s=getISO();
    if(s){ const [y,mo,d]=s.split('-'); prev.textContent='→ '+(+d)+' de '+_MESES[+mo-1]+' de '+y; prev.style.color='#166534'; }
    else if(!(inp.value||'').trim()){ prev.textContent=opts.vacio?'(sin filtro de fecha)':'Escribí DÍA/MES/AÑO'; prev.style.color=''; }
    else { prev.textContent='⚠ Fecha inválida. Escribí DÍA/MES/AÑO, ej: 03/09/2026'; prev.style.color='#b91c1c'; }
  }
  inp.oninput=upd; upd();
  const wrap=el('div',{}); wrap.append(inp,prev);
  return {el:wrap, input:inp, getISO};
}

// Descarga un Excel con TODAS las caravanas (respaldo).
async function exportarBackup(btn){
  const txt=btn.textContent; btn.disabled=true; btn.innerHTML='<span class="spin"></span> Generando…';
  try{
    let rows=[]; let desde=0; const pag=1000;
    while(true){
      const {data,error}=await sb.from('v_caravanas')
        .select('numero,numero_orig,categoria,estado,lote,propietario,fecha_ingreso,fecha_40,fecha_90,senasa_estado')
        .order('numero').range(desde,desde+pag-1);
      if(error) throw error;
      rows=rows.concat(data||[]);
      if(!data || data.length<pag) break;
      desde+=pag;
    }
    const enc=['CARAVANA','CARAVANA ORIG','CATEGORIA','ESTADO','LOTE','PROPIETARIO','FECHA INGRESO','FECHA 40 DIAS','FECHA 90 DIAS','SENASA'];
    const aoa=[enc].concat(rows.map(r=>[r.numero,r.numero_orig||'',r.categoria||'',r.estado,r.lote||'',r.propietario||'',
      r.fecha_ingreso||'',r.fecha_40||'',r.fecha_90||'',r.senasa_estado||'']));
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'caravanas');
    XLSX.writeFile(wb,'caravanas_backup_'+hoyISO()+'.xlsx');
  }catch(e){ alert('No se pudo generar el backup: '+errMsg(e)); }
  btn.disabled=false; btn.textContent=txt;
}
